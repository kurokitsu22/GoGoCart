version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: gocart_db
    environment:
      POSTGRES_DB: gocart_dev
      POSTGRES_USER: gocart_user
      POSTGRES_PASSWORD: gocart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocart_user -d gocart_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: gocart_app
    environment:
      DATABASE_URL: "postgresql://gocart_user:gocart_password@db:5432/gocart_dev"
      DIRECT_URL: "postgresql://gocart_user:gocart_password@db:5432/gocart_dev"
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

volumes:
  postgres_data:
